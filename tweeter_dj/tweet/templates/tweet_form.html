{% extends "base.html" %}
<!-- {% load static %} -->

{% block title %}
Jiocoders Tweets
{% endblock %}

{% block content %}
<h1 class="text-center mt-4">Welcome to the Tweeter App</h1>

<h2> {% if form.instance.pk %} Edit Tweet {% else %} Create Tweet {% endif %}
    <form method="post" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Submit</button>
    </form>
</h2>
<a href="{% url 'tweet_list' %}" class="btn btn-primary mt-4">Back to Tweet List</a>
{% endblock %}
